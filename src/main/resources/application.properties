spring.application.name=estoque-veiculos

# --- Banco de dados MySQL (ajuste usuario e senha) ---
spring.datasource.url=jdbc:mysql://localhost:3306/estoque_veiculos?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234

# O schema e criado pelo script database/script.sql, entao o Hibernate nao altera o banco.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080
